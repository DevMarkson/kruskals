<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kruskal's Algorithm Visualizer: CSC 551 Assignment</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            text-align: center;
            background-color: #f8fafc;
            color: #1e293b;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .visualization-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px auto;
            max-width: 1200px;
        }

        .panel {
            flex: 1;
            min-width: 450px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .panel h3 {
            margin-top: 0;
            color: #334155;
            font-size: 1.15rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .network-view {
            height: 450px;
            border: 1px solid #e2e8f0;
            background-color: #fafafa;
            border-radius: 8px;
        }

        #status-box {
            margin-top: 20px;
            padding: 15px 25px;
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: inline-block;
            min-width: 350px;
            font-size: 1.15em;
            font-weight: 600;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
        }

        #controls {
            margin: 20px auto;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 600px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        textarea {
            width: 250px;
            height: 120px;
            font-family: monospace;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            padding: 10px 20px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #3b82f6;
            color: white;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        button.reset-btn {
            background-color: #64748b;
        }

        button.reset-btn:hover {
            background-color: #475569;
        }

        table {
            margin: 20px auto;
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
        }

        table th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
        }

        table th,
        table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
    </style>
</head>

<body>

    <h1>Kruskal's Algorithm Visualizer</h1>
    <p class="subtitle">A visual tool to demonstrate Kruskal's Minimum Spanning Tree (MST) Algorithm.</p>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Matriculation Number</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alikah, Joseph</td>
                <td>231414</td>
            </tr>
            <tr>
                <td>Markson, Favour</td>
                <td>230905</td>
            </tr>
            <tr>
                <td>Afolabi, Peace</td>
                <td>230882</td>
            </tr>
        </tbody>
    </table>

    <div id="controls">
        <textarea id="graph-input" placeholder="Format: A-B:4">
A-B:4
A-C:2
B-C:1
B-D:5
C-D:8
C-E:10
D-E:2
D-F:6
E-F:3
        </textarea>
        <div class="buttons">
            <button onclick="updateGraph()">Update Graph</button>
            <button onclick="resetGraph()" class="reset-btn">Reset Animation</button>
        </div>
    </div>

    <div class="visualization-container">
        <div class="panel">
            <h3>Original Graph (Reference)</h3>
            <div id="network-original" class="network-view"></div>
        </div>
        <div class="panel">
            <h3>Kruskal's MST Process</h3>
            <div id="network-kruskal" class="network-view"></div>
        </div>
    </div>

    <div id="status-box">Starting up...</div>

    <script src="kruskal.js"></script>
</body>

</html>
