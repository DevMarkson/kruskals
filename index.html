<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kruskal's Algorithm Visualizer</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        #mynetwork {
            width: 800px;
            height: 500px;
            border: 1px solid lightgray;
            background-color: #fcfcfc;
            margin: 0 auto;
        }
        #status-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #eee;
            border-radius: 5px;
            display: inline-block;
            min-width: 300px;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Kruskal's Algorithm (Edge-by-Edge)</h2>
    <div id="mynetwork"></div>
    <div id="status-box">Starting up...</div>

    <script>
        // 1. DISJOINT SET (UNION-FIND) IMPLEMENTATION
        class DisjointSet {
            constructor(nodes) {
                this.parent = {};
                this.rank = {};
                nodes.forEach(node => {
                    this.parent[node.id] = node.id;
                    this.rank[node.id] = 0;
                });
            }

            find(i) {
                if (this.parent[i] === i) return i;
                this.parent[i] = this.find(this.parent[i]); // Path compression
                return this.parent[i];
            }

            union(i, j) {
                let rootI = this.find(i);
                let rootJ = this.find(j);

                if (rootI !== rootJ) {
                    if (this.rank[rootI] < this.rank[rootJ]) {
                        this.parent[rootI] = rootJ;
                    } else if (this.rank[rootI] > this.rank[rootJ]) {
                        this.parent[rootJ] = rootI;
                    } else {
                        this.parent[rootJ] = rootI;
                        this.rank[rootI]++;
                    }
                    return true; // Union successful (no cycle)
                }
                return false; // Cycle detected
            }
        }

        // 2. GRAPH DATA SETUP
        const nodesArray = [
            { id: 'A', label: 'A', color: '#97C2FC' },
            { id: 'B', label: 'B', color: '#97C2FC' },
            { id: 'C', label: 'C', color: '#97C2FC' },
            { id: 'D', label: 'D', color: '#97C2FC' },
            { id: 'E', label: 'E', color: '#97C2FC' },
            { id: 'F', label: 'F', color: '#97C2FC' }
        ];

        // Unsorted edges
        const allEdges = [
            { from: 'A', to: 'B', label: '4', weight: 4 },
            { from: 'A', to: 'C', label: '2', weight: 2 },
            { from: 'B', to: 'C', label: '1', weight: 1 },
            { from: 'B', to: 'D', label: '5', weight: 5 },
            { from: 'C', to: 'D', label: '8', weight: 8 },
            { from: 'C', to: 'E', label: '10', weight: 10 },
            { from: 'D', to: 'E', label: '2', weight: 2 },
            { from: 'D', to: 'F', label: '6', weight: 6 },
            { from: 'E', to: 'F', label: '3', weight: 3 }
        ];

        // Sort edges by weight ascending (Crucial for Kruskal's)
        allEdges.sort((a, b) => a.weight - b.weight);

        // 3. VIS.JS INITIALIZATION
        const nodes = new vis.DataSet(nodesArray);
        const edges = new vis.DataSet([]); // Start with no edges drawn

        const container = document.getElementById('mynetwork');
        const data = { nodes: nodes, edges: edges };
        const options = {
            physics: {
                enabled: true,
                barnesHut: { springLength: 150 }
            },
            edges: {
                font: { size: 16, align: 'top' },
                smooth: false // Straight lines are usually better for standard MSTs
            }
        };

        const network = new vis.Network(container, data, options);
        const statusBox = document.getElementById('status-box');

        // Helper function to pause execution for animations
        const delay = ms => new Promise(res => setTimeout(res, ms));

        // 4. ANIMATION & ALGORITHM LOGIC
        async function runKruskal() {
            const ds = new DisjointSet(nodesArray);
            let acceptedEdgesCount = 0;
            const targetEdges = nodesArray.length - 1; // V - 1 edges needed for MST

            // Give the physics engine a second to settle the nodes before drawing lines
            statusBox.innerText = "Sorting edges... starting algorithm.";
            await delay(1500);

            for (let i = 0; i < allEdges.length; i++) {
                // Stop early if MST is complete
                if (acceptedEdgesCount === targetEdges) {
                    break;
                }

                const edge = allEdges[i];
                statusBox.style.color = "black";
                statusBox.innerText = `Evaluating edge ${edge.from}-${edge.to} (Weight: ${edge.weight})...`;
                
                await delay(1000); // Pause for dramatic effect

                if (ds.union(edge.from, edge.to)) {
                    // ACCEPTED
                    statusBox.style.color = "#2ECC71"; // Green
                    statusBox.innerText = `Accepted edge ${edge.from}-${edge.to}!`;
                    edges.add({
                        id: `edge_${i}`,
                        from: edge.from,
                        to: edge.to,
                        label: edge.label,
                        color: { color: '#2ECC71', highlight: '#2ECC71' },
                        width: 4
                    });
                    acceptedEdgesCount++;
                } else {
                    // REJECTED (CYCLE)
                    statusBox.style.color = "#E74C3C"; // Red
                    statusBox.innerText = `Rejected edge ${edge.from}-${edge.to} (Forms a Cycle).`;
                    
                    // Draw it dashed red to show it fails
                    edges.add({
                        id: `edge_${i}`,
                        from: edge.from,
                        to: edge.to,
                        label: edge.label,
                        color: { color: '#E74C3C', highlight: '#E74C3C' },
                        dashes: true,
                        width: 2
                    });
                    
                    await delay(1000); // Leave the red line up briefly
                    edges.remove(`edge_${i}`); // Remove it
                }
                
                await delay(1000); // Pause before moving to the next edge
            }

            // Final state
            if (acceptedEdgesCount === targetEdges) {
                statusBox.style.color = "#27ae60";
                statusBox.innerText = "🎉 Minimum Spanning Tree Complete! 🎉";
                // Optionally turn off physics here so the graph freezes in place
                network.setOptions({ physics: { enabled: false } }); 
            } else {
                statusBox.style.color = "#d35400";
                statusBox.innerText = "Algorithm finished. (Graph was disconnected)";
            }
        }

        // Start the process
        runKruskal();
    </script>
</body>
</html>
