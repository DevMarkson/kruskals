<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kruskal's Algorithm Visualizer</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        #mynetwork {
            width: 800px;
            height: 500px;
            border: 1px solid lightgray;
            background-color: #fcfcfc;
            margin: 0 auto;
        }
        #status-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #eee;
            border-radius: 5px;
            display: inline-block;
            min-width: 300px;
            font-size: 1.2em;
            font-weight: bold;
        }
        #controls {
            margin: 20px auto;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: flex-start;
        }
        textarea {
            width: 200px;
            height: 150px;
            font-family: monospace;
            padding: 10px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 1em;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Kruskal's Algorithm (Edge-by-Edge)</h2>
    
    <div id="controls">
        <textarea id="graph-input" placeholder="Format: A-B:4">
A-B:4
A-C:2
B-C:1
B-D:5
C-D:8
C-E:10
D-E:2
D-F:6
E-F:3
        </textarea>
        <div class="buttons">
            <button onclick="updateGraph()">Update Graph</button>
            <button onclick="resetGraph()">Reset Animation</button>
        </div>
    </div>

    <div id="mynetwork"></div>
    <div id="status-box">Starting up...</div>

    <script>
        // 1. DISJOINT SET (UNION-FIND) IMPLEMENTATION
        class DisjointSet {
            constructor(nodes) {
                this.parent = {};
                this.rank = {};
                nodes.forEach(node => {
                    this.parent[node.id] = node.id;
                    this.rank[node.id] = 0;
                });
            }

            find(i) {
                if (this.parent[i] === i) return i;
                this.parent[i] = this.find(this.parent[i]); // Path compression
                return this.parent[i];
            }

            union(i, j) {
                let rootI = this.find(i);
                let rootJ = this.find(j);

                if (rootI !== rootJ) {
                    if (this.rank[rootI] < this.rank[rootJ]) {
                        this.parent[rootI] = rootJ;
                    } else if (this.rank[rootI] > this.rank[rootJ]) {
                        this.parent[rootJ] = rootI;
                    } else {
                        this.parent[rootJ] = rootI;
                        this.rank[rootI]++;
                    }
                    return true; // Union successful (no cycle)
                }
                return false; // Cycle detected
            }
        }

        // Global state for dynamic updates
        let currentRunId = 0;
        let nodesArray = [];
        let allEdges = [];
        let nodes = new vis.DataSet([]);
        let edges = new vis.DataSet([]);
        let network = null;
        let container = document.getElementById('mynetwork');
        let statusBox = document.getElementById('status-box');

        function parseGraphInput() {
            const text = document.getElementById('graph-input').value;
            const lines = text.split('\n');
            const nodeSet = new Set();
            const parsedEdges = [];

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                // Match "Node1-Node2:Weight" format
                const match = line.match(/^([^-:]+)-([^-:]+):(-?\d+)$/);
                if (match) {
                    const u = match[1].trim();
                    const v = match[2].trim();
                    const w = parseInt(match[3], 10);
                    nodeSet.add(u);
                    nodeSet.add(v);
                    parsedEdges.push({ from: u, to: v, label: String(w), weight: w });
                }
            });

            nodesArray = Array.from(nodeSet).map(id => ({ id, label: id, color: '#97C2FC' }));
            allEdges = parsedEdges;
            allEdges.sort((a, b) => a.weight - b.weight);
        }

        function initNetwork() {
            nodes = new vis.DataSet(nodesArray);
            edges = new vis.DataSet([]); // Start with no edges drawn

            const data = { nodes: nodes, edges: edges };
            const options = {
                physics: {
                    enabled: true,
                    barnesHut: { springLength: 150 }
                },
                edges: {
                    font: { size: 16, align: 'top' },
                    smooth: false // Straight lines are usually better for standard MSTs
                }
            };

            if (network) {
                network.destroy();
            }
            network = new vis.Network(container, data, options);
        }

        // Helper function to pause execution for animations
        const delay = ms => new Promise(res => setTimeout(res, ms));

        // ANIMATION & ALGORITHM LOGIC
        async function runKruskal(runId) {
            const ds = new DisjointSet(nodesArray);
            let acceptedEdgesCount = 0;
            const targetEdges = nodesArray.length > 0 ? nodesArray.length - 1 : 0;

            // Give the physics engine a second to settle the nodes before drawing lines
            statusBox.style.color = "black";
            statusBox.innerText = "Sorting edges... starting algorithm.";
            await delay(1500);
            if (currentRunId !== runId) return;

            for (let i = 0; i < allEdges.length; i++) {
                // Stop early if MST is complete
                if (acceptedEdgesCount === targetEdges) {
                    break;
                }

                const edge = allEdges[i];
                statusBox.style.color = "black";
                statusBox.innerText = `Evaluating edge ${edge.from}-${edge.to} (Weight: ${edge.weight})...`;
                
                await delay(1000); // Pause for dramatic effect
                if (currentRunId !== runId) return;

                if (ds.union(edge.from, edge.to)) {
                    // ACCEPTED
                    statusBox.style.color = "#2ECC71"; // Green
                    statusBox.innerText = `Accepted edge ${edge.from}-${edge.to}!`;
                    edges.add({
                        id: `edge_${i}`,
                        from: edge.from,
                        to: edge.to,
                        label: edge.label,
                        color: { color: '#2ECC71', highlight: '#2ECC71' },
                        width: 4
                    });
                    acceptedEdgesCount++;
                } else {
                    // REJECTED (CYCLE)
                    statusBox.style.color = "#E74C3C"; // Red
                    statusBox.innerText = `Rejected edge ${edge.from}-${edge.to} (Forms a Cycle).`;
                    
                    // Draw it dashed red to show it fails
                    edges.add({
                        id: `edge_${i}`,
                        from: edge.from,
                        to: edge.to,
                        label: edge.label,
                        color: { color: '#E74C3C', highlight: '#E74C3C' },
                        dashes: true,
                        width: 2
                    });
                    
                    await delay(1000); // Leave the red line up briefly
                    if (currentRunId !== runId) return;
                    edges.remove(`edge_${i}`); // Remove it
                }
                
                await delay(1000); // Pause before moving to the next edge
                if (currentRunId !== runId) return;
            }

            // Final state
            if (acceptedEdgesCount === targetEdges && targetEdges > 0) {
                statusBox.style.color = "#27ae60";
                statusBox.innerText = "🎉 Minimum Spanning Tree Complete! 🎉";
                // Optionally turn off physics here so the graph freezes in place
                network.setOptions({ physics: { enabled: false } }); 
            } else if (targetEdges > 0) {
                statusBox.style.color = "#d35400";
                statusBox.innerText = "Algorithm finished. (Graph was disconnected)";
            } else {
                statusBox.style.color = "black";
                statusBox.innerText = "No graph data.";
            }
        }

        function updateGraph() {
            parseGraphInput();
            resetGraph();
        }

        function resetGraph() {
            currentRunId++;
            initNetwork();
            runKruskal(currentRunId);
        }

        // Start the process initially
        updateGraph();
    </script>
</body>
</html>
